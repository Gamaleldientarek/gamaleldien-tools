<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    background:#0a0a0a; color:#fff;
    font-family:'Clash Display', -apple-system, sans-serif;
    position:relative; overflow:hidden;
  }
  /* Orange rule across the top — the family signature */
  .topbar { position:absolute; inset:0 0 auto 0; height:8px; background:#e16105; }

  /* The dot lattice, same 32px pitch as every surface */
  .lattice {
    position:absolute; inset:0;
    background-image:radial-gradient(circle, rgba(255,255,255,0.022) 1px, transparent 1px);
    background-size:32px 32px;
  }
  /* Bloom anchored BELOW the frame so its hot centre never reaches type */
  .bloom {
    position:absolute; inset:0;
    background-image:radial-gradient(ellipse 78% 50% at 50% 138%,
      #ffe9c5 0%, #d64e0a 18%, #b0220c 40%, transparent 70%);
    opacity:.4;
  }

  .stage { position:absolute; inset:8px 0 74px 0; display:flex; align-items:center; padding:0 80px; gap:64px; }

  .left { flex:1; }
  h1 { font-size:92px; font-weight:700; line-height:.92; letter-spacing:-.035em; text-transform:uppercase; }
  h1 .accent { color:#e16105; display:block; }
  .sub { margin-top:22px; font-size:21px; font-weight:500; letter-spacing:.06em;
         text-transform:uppercase; color:#999; }
  .chips { margin-top:28px; display:flex; gap:10px; flex-wrap:wrap; }
  .chips { flex-wrap:nowrap; }
  .chip { border:1px solid #333; border-radius:999px; padding:8px 14px;
          font-size:13.5px; font-weight:600; letter-spacing:.03em;
          white-space:nowrap; text-transform:uppercase; color:#bbb; }

  /* Right: the running order itself — the clearest picture of what this does */
  .right { width:410px; display:flex; flex-direction:column; gap:11px; }
  .row { display:flex; align-items:center; gap:18px;
         background:#141414; border:1px solid rgba(255,255,255,.07);
         border-radius:14px; padding:14px 20px; }
  .row .n { font-family:'SF Mono', ui-monospace, monospace; font-size:17px;
            font-weight:700; color:#e16105; opacity:.6; min-width:26px; }
  .row .name { font-size:20px; font-weight:600; color:#fff; }
  .row.first { background:#1d1206; border-color:rgba(225,97,5,.55); }
  .row.first .n { opacity:1; }
  .row.first .tag { margin-left:auto; font-size:13px; font-weight:600;
                    letter-spacing:.12em; text-transform:uppercase; color:#ff7519; }
  .row.dim { opacity:.42; }

  .footer { position:absolute; left:0; right:0; bottom:0; height:74px;
            border-top:1px solid rgba(255,255,255,.08);
            display:flex; align-items:center; justify-content:space-between;
            padding:0 80px; font-size:18px; font-weight:600;
            letter-spacing:.08em; text-transform:uppercase; color:#777; }
</style></head>
<body>
  <div class="lattice"></div>
  <div class="bloom"></div>
  <div class="topbar"></div>

  <div class="stage">
    <div class="left">
      <h1>Turn Order<span class="accent">Generator</span></h1>
      <p class="sub">Fair running order for any group</p>
      <div class="chips">
        <span class="chip">Join by QR</span>
        <span class="chip">Live roster</span>
        <span class="chip">Projection</span>
        <span class="chip">No sign-up</span>
      </div>
    </div>

    <div class="right">
      <div class="row first"><span class="n">01</span><span class="name">Brave Falcon</span><span class="tag">Goes first</span></div>
      <div class="row"><span class="n">02</span><span class="name">Silver Crane</span></div>
      <div class="row"><span class="n">03</span><span class="name">Desert Rose</span></div>
      <div class="row dim"><span class="n">04</span><span class="name">Quiet Thunder</span></div>
      <div class="row dim"><span class="n">05</span><span class="name">Golden Horizon</span></div>
    </div>
  </div>

  <div class="footer"><span>tools.gamaleldien.com</span><span>by Gamal Eldien</span></div>
</body></html>
