<!DOCTYPE html>

<title>OG source — 1200×630</title>
<style>
@import url('https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { width: 1200px; height: 630px; overflow: hidden; }

body {
    font-family: 'Clash Display', sans-serif;
    background: #0a0a0a;
    color: #fff;
    position: relative;
    background-image: radial-gradient(circle, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 32px 32px;
}

.burst {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 1200px;
    height: 340px;
}

.baseline {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: linear-gradient(90deg,
        transparent 0%,
        rgba(255,255,255,0.10) 25%,
        rgba(255,117,25,0.6) 50%,
        rgba(255,255,255,0.10) 75%,
        transparent 100%);
}

.topbar {
    position: absolute;
    top: 44px;
    left: 60px;
    right: 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.topbar svg { height: 44px; width: auto; }

.domain {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #808080;
    text-transform: uppercase;
}

.content {
    position: absolute;
    top: 128px;
    left: 0;
    right: 0;
    text-align: center;
}

h1 {
    font-size: 108px;
    font-weight: 600;
    line-height: 0.98;
    letter-spacing: -0.03em;
    text-transform: uppercase;
}

h1 .amp { color: rgb(255, 117, 25); }

.sub {
    margin-top: 22px;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #999999;
}

.stats {
    margin-top: 34px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 48px;
}

.stat { text-align: center; }

.stat b {
    display: block;
    font-size: 44px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1;
}

.stat span {
    display: block;
    margin-top: 8px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #808080;
}

.sep { width: 1px; height: 44px; background: rgba(255,255,255,0.12); }
</style>
</head>

<script>
/* Static frame of the landing burst, tuned for the OG crop */
var canvas = document.querySelector('.burst');
var ctx = canvas.getContext('2d');
var W = 1200, H = 340;
var PALETTE = [[176, 34, 12], [214, 78, 10], [255, 117, 25], [255, 233, 197]];
function pal(k) {
    var seg = Math.min(2.999, Math.max(0, k) * 3), i = Math.floor(seg), f = seg - i;
    var a = PALETTE[i], b = PALETTE[i + 1];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}
function rgba(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; }

/* Seeded PRNG so the frame is reproducible */
var seed = 20260801;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

var ox = W / 2, oy = H + 8;
var core = ctx.createRadialGradient(ox, oy, 0, ox, oy, 130);
core.addColorStop(0, 'rgba(255,233,197,0.35)');
core.addColorStop(0.5, 'rgba(255,117,25,0.12)');
core.addColorStop(1, 'rgba(255,117,25,0)');
ctx.fillStyle = core;
ctx.fillRect(ox - 130, oy - 130, 260, 260);

var N = 240, maxR = 330;
ctx.lineWidth = 1;
ctx.lineCap = 'round';
for (var i = 0; i < N; i++) {
    var a = Math.PI + (i / (N - 1)) * Math.PI + (rnd() - 0.5) * 0.02;
    var lenK = 0.22 + Math.pow(rnd(), 1.5) * 0.78;
    var len = lenK * maxR;
    var k = Math.min(1, lenK * (0.55 + rnd() * 0.7));
    var alpha = 0.18 + rnd() * 0.32;
    var tip = 1 + rnd() * 1.8;
    var ex = ox + Math.cos(a) * len;
    var ey = oy + Math.sin(a) * len;
    ctx.strokeStyle = rgba(pal(k), alpha);
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.fillStyle = rgba(pal(Math.min(1, k + 0.25)), Math.min(1, alpha + 0.35));
    ctx.beginPath();
    ctx.arc(ex, ey, tip, 0, 6.2832);
    ctx.fill();
}

/* ============================================================
   Offscreen 2x render of the full OG card — immune to browser
   zoom — uploaded as PNG to the local receiver on :8977.
   ============================================================ */
(async function () {
    var LOGO_P1 = document.querySelectorAll('.topbar svg path')[0].getAttribute('d');
    var LOGO_P2 = document.querySelectorAll('.topbar svg path')[1].getAttribute('d');

    await Promise.all([
        document.fonts.load('600 108px "Clash Display"', 'TOOLS'),
        document.fonts.load('500 19px "Clash Display"', 'HEXER'),
        document.fonts.load('700 17px "Clash Display"', 'TOOLS'),
        document.fonts.load('600 44px "Clash Display"', '12'),
        document.fonts.load('600 13px "Clash Display"', 'FREE')
    ]);
    await document.fonts.ready;

    var c = document.createElement('canvas');
    c.width = 2400; c.height = 1260;
    var g = c.getContext('2d');
    g.scale(2, 2);

    /* bg */
    g.fillStyle = '#0a0a0a';
    g.fillRect(0, 0, 1200, 630);

    /* dot grid */
    g.fillStyle = 'rgba(255,255,255,0.022)';
    for (var dx = 16; dx < 1200; dx += 32) {
        for (var dy = 16; dy < 630; dy += 32) {
            g.beginPath(); g.arc(dx, dy, 1, 0, 6.2832); g.fill();
        }
    }

    /* burst (seeded, origin bottom center) */
    var s2 = 20260801;
    function rnd2() { s2 = (s2 * 1664525 + 1013904223) >>> 0; return s2 / 4294967296; }
    var bx = 600, by = 638;
    var core2 = g.createRadialGradient(bx, by, 0, bx, by, 130);
    core2.addColorStop(0, 'rgba(255,233,197,0.35)');
    core2.addColorStop(0.5, 'rgba(255,117,25,0.12)');
    core2.addColorStop(1, 'rgba(255,117,25,0)');
    g.fillStyle = core2;
    g.fillRect(bx - 130, by - 130, 260, 260);
    g.lineWidth = 1;
    g.lineCap = 'round';
    for (var i = 0; i < 240; i++) {
        var a = Math.PI + (i / 239) * Math.PI + (rnd2() - 0.5) * 0.02;
        var lenK = 0.22 + Math.pow(rnd2(), 1.5) * 0.78;
        var len = lenK * 330;
        var k = Math.min(1, lenK * (0.55 + rnd2() * 0.7));
        var alpha = 0.18 + rnd2() * 0.32;
        var tip = 1 + rnd2() * 1.8;
        var ex = bx + Math.cos(a) * len, ey = by + Math.sin(a) * len;
        g.strokeStyle = rgba(pal(k), alpha);
        g.beginPath(); g.moveTo(bx, by); g.lineTo(ex, ey); g.stroke();
        g.fillStyle = rgba(pal(Math.min(1, k + 0.25)), Math.min(1, alpha + 0.35));
        g.beginPath(); g.arc(ex, ey, tip, 0, 6.2832); g.fill();
    }

    /* baseline */
    var bl = g.createLinearGradient(0, 0, 1200, 0);
    bl.addColorStop(0, 'rgba(0,0,0,0)');
    bl.addColorStop(0.25, 'rgba(255,255,255,0.10)');
    bl.addColorStop(0.5, 'rgba(255,117,25,0.6)');
    bl.addColorStop(0.75, 'rgba(255,255,255,0.10)');
    bl.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = bl;
    g.fillRect(0, 628, 1200, 2);

    /* logo */
    g.save();
    g.translate(60, 44);
    g.scale(44 / 60.13, 44 / 60.13);
    g.fillStyle = '#f1f2f2';
    g.fill(new Path2D(LOGO_P1));
    g.fill(new Path2D(LOGO_P2));
    g.restore();

    /* domain */
    g.letterSpacing = '2.4px';
    g.font = '700 17px "Clash Display"';
    g.fillStyle = '#808080';
    g.textAlign = 'right';
    g.fillText('TOOLS.GAMALELDIEN.COM', 1140, 72);

    /* title */
    g.letterSpacing = '-3.2px';
    g.font = '600 108px "Clash Display"';
    var w1 = g.measureText('TOOLS ').width;
    var w2 = g.measureText('&').width;
    var x0 = 600 - (w1 + w2) / 2;
    g.textAlign = 'left';
    g.fillStyle = '#ffffff';
    g.fillText('TOOLS ', x0, 216);
    g.fillStyle = 'rgb(255,117,25)';
    g.fillText('&', x0 + w1, 216);
    g.textAlign = 'center';
    g.fillStyle = '#ffffff';
    g.fillText('LEARNING', 600, 322);

    /* tools list */
    g.letterSpacing = '1.9px';
    g.font = '500 19px "Clash Display"';
    var main = 'HEXER  ·  UI COLORS  ·  LOTTIE HUB  ·  DARK MODE  ·  PROMPT BUILDER  ·  FIGMA PAGE NUMBERS  ';
    var more = '+ 6 MORE';
    var mw = g.measureText(main).width;
    var ow = g.measureText(more).width;
    var tx = 600 - (mw + ow) / 2;
    g.textAlign = 'left';
    g.fillStyle = '#999999';
    g.fillText(main, tx, 377);
    g.fillStyle = 'rgb(255,117,25)';
    g.fillText(more, tx + mw, 377);

    /* stats */
    var cols = [[440, '12', 'TOOLS'], [600, '100%', 'FREE'], [760, '$0', 'FOREVER']];
    g.textAlign = 'center';
    for (var ci = 0; ci < 3; ci++) {
        g.letterSpacing = '-0.9px';
        g.font = '600 44px "Clash Display"';
        g.fillStyle = '#ffffff';
        g.fillText(cols[ci][1], cols[ci][0], 453);
        g.letterSpacing = '1.6px';
        g.font = '600 13px "Clash Display"';
        g.fillStyle = '#808080';
        g.fillText(cols[ci][2], cols[ci][0], 478);
    }
    g.fillStyle = 'rgba(255,255,255,0.12)';
    g.fillRect(520, 418, 1, 46);
    g.fillRect(680, 418, 1, 46);

    c.toBlob(async function (blob) {
        try {
            var res = await fetch('http://127.0.0.1:8977/og.png', { method: 'PUT', body: blob });
            document.title = res.ok ? 'UPLOADED' : 'UPLOAD FAILED ' + res.status;
        } catch (e) {
            document.title = 'UPLOAD ERROR: ' + e.message;
        }
    }, 'image/png');
})();
</script>
