<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lottie Previewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Lottie Previewer</h1>
      <p>Drop JSON files to preview</p>
    </header>

    <div class="drop-zone" id="dropZone">
      <div class="drop-icon">+</div>
      <p>Drag & Drop</p>
      <span>or click to browse</span>
      <input type="file" id="fileInput" accept=".json" multiple hidden>
    </div>

    <div class="animations-container" id="animationsContainer"></div>

    <div class="actions" id="actions" style="display: none;">
      <button class="btn btn-clear" id="clearAll">Clear All</button>
    </div>

    <footer class="footer">
      <a href="https://99.zone" target="_blank" style="color: #155DFC; text-decoration: none; font-weight: 600;">Zone 99</a> — Where Business Meets Code
    </footer>
  </div>

  <!-- GIF Export Modal -->
  <div class="gif-modal" id="gifModal">
    <div class="gif-modal-content">
      <div class="gif-modal-header">
        <h3>Exporting GIF</h3>
        <button class="gif-modal-close" id="gifModalClose">x</button>
      </div>
      <div class="gif-modal-body">
        <div class="gif-progress-container">
          <div class="gif-progress-bar" id="gifProgressBar"></div>
        </div>
        <p class="gif-status" id="gifStatus">Capturing frames...</p>
      </div>
    </div>
  </div>

  <script src="libs/lottie.min.js"></script>
  <script src="libs/gif.js"></script>
  <script src="popup.js"></script>
</body>
</html>
